<?xml version="1.0"?>
<driconf>
    <device driver="panvk">
        <engine engine_name_match="ANGLE">
            <!--
               ANGLE requires VK_EXT_transform_feedback or vertexPipelineStoresAndAtomics
               to enable OpenGL 3.1 support. As we currently don't support this extension,
               we enable support for vertexPipelineStoresAndAtomics to allow XFB emulation
               on hardware without speculative behaviors around vertices.
               -->
            <option name="pan_enable_vertex_pipeline_stores_atomics" value="true" />
        </engine>

        <!--
            Tomb Raider (2013) writes one clip distance in most vertex shaders.
            On v9 they are emulated with a fragment-shader discard, which turns
            off forward pixel kill and early depth for those draws: the menu
            runs at about half the frame rate. The Arm driver doesn't support
            clip distances at all, and through the Winlator wrapper the game
            runs without them. Set pan_disable_clip_cull_distance=false in the
            environment to keep them.
        -->
        <application name="Tomb Raider (2013)" executable="TombRaider.exe">
            <option name="pan_disable_clip_cull_distance" value="true" />
        </application>
        <application name="Tomb Raider (2013), by API name" application_name_match="^TombRaider[.]exe$">
            <option name="pan_disable_clip_cull_distance" value="true" />
        </application>

        <!--
            Naruto Shippuden: Ultimate Ninja Storm 2 polls D3D11 timestamp
            queries before its first frame. v9 reports no timestamp support,
            the queries never become available and the game hangs on a white
            or black window. Set pan_v9_timestamps=false in the environment
            to turn it off again.
        -->
        <application name="Naruto Shippuden: Ultimate Ninja Storm 2" executable="NSUNS2.exe">
            <option name="pan_v9_timestamps" value="true" />
        </application>
        <application name="Naruto Shippuden: Ultimate Ninja Storm 2, by API name" application_name_match="^NSUNS2[.]exe$">
            <option name="pan_v9_timestamps" value="true" />
        </application>
    </device>
</driconf>
